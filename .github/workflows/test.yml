name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests (stand-in tools)
        run: python -m unittest discover -s tests -v

  real-tools:
    name: ubuntu / real TruffleHog and dotenvx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dotenvx
        run: npm install -g @dotenvx/dotenvx
      - name: Install TruffleHog
        # Pinned: the installer's "latest" can point at a release whose binaries are not
        # published yet (v3.99.4 returned 404 on 2026-10-22). Bump deliberately.
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin v3.99.3
      - name: Tool versions
        run: trufflehog --version && dotenvx --version
      - name: Tests, including the real-tools tier
        env:
          SWEEP_TEST_REAL_TOOLS: "1"
        run: python -m unittest discover -s tests -v
      - name: Older TruffleHog releases are used as they are
        # 3.12: base64 results, no --exclude-paths, --directory only; 3.40: only --log-level missing
        run: |
          for v in 3.12.0 3.40.0; do
            curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b "$RUNNER_TEMP/th-$v" "v$v"
            python sweep_and_secure.py --check-setup --trufflehog "$RUNNER_TEMP/th-$v/trufflehog" | tee "check-$v.log"
            grep -q 'an older TruffleHog, used as it is' "check-$v.log"
            python sweep_and_secure.py --dry-run --trufflehog "$RUNNER_TEMP/th-$v/trufflehog" tests | grep -q 'Scan took'
          done
      - name: Exercise install.sh where the tools are present (its setup check must pass)
        run: |
          mkdir fake-release
          cp sweep_and_secure.py install.sh fake-release/
          (cd fake-release && sha256sum * > SHA256SUMS)
          sh install.sh -u "file://$PWD/fake-release" -b "$RUNNER_TEMP/bin" 2>&1 | tee install.log
          grep -q '\[ok\] trufflehog  3\.' install.log
          grep -q '\[ok\] dotenvx ' install.log
          grep -q 'Setup looks good' install.log

  package:
    name: ubuntu / package, console script and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Install the wheel and run the console script
        run: |
          python -m pip install --quiet dist/*.whl
          sweep-and-secure --version
          sweep-and-secure --help > /dev/null
      - name: Exercise install.sh against the built assets
        run: |
          mkdir fake-release
          cp sweep_and_secure.py install.sh dist/* fake-release/
          (cd fake-release && sha256sum * > SHA256SUMS)
          # no TruffleHog or dotenvx here: the install succeeds and the check names both
          sh install.sh -u "file://$PWD/fake-release" -b "$RUNNER_TEMP/bin" 2>&1 | tee install.log
          grep -q 'Installed ' install.log
          grep -q 'trufflehog is not installed' install.log
          grep -q 'dotenvx is not installed' install.log
          grep -q 'Install what is missing' install.log
          sh install.sh -n -u "file://$PWD/fake-release" -b "$RUNNER_TEMP/bin" | grep -q 'skipped here because of -n'
          "$RUNNER_TEMP/bin/sweep-and-secure" --version
