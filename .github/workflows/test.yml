name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests (stand-in tools)
        run: python -m unittest discover -s tests -v

  real-tools:
    name: ubuntu / real TruffleHog and dotenvx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dotenvx
        run: npm install -g @dotenvx/dotenvx
      - name: Install TruffleHog
        # Pinned: the installer's "latest" can point at a release whose binaries are not
        # published yet (v3.99.4 returned 404 on 2026-10-22). Bump deliberately.
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin v3.99.3
      - name: Tool versions
        run: trufflehog --version && dotenvx --version
      - name: Tests, including the real-tools tier
        env:
          SWEEP_TEST_REAL_TOOLS: "1"
        run: python -m unittest discover -s tests -v
