[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-and-secure"
description = "Find plaintext API keys and secrets in a folder tree with TruffleHog and encrypt them with dotenvx"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "voxgig" }]
keywords = ["secrets", "dotenv", "dotenvx", "trufflehog", "security", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/voxgig/sweep-and-secure"
Issues = "https://github.com/voxgig/sweep-and-secure/issues"
Releases = "https://github.com/voxgig/sweep-and-secure/releases"

[project.scripts]
sweep-and-secure = "sweep_and_secure:cli"

# A single module, not a package: only the script goes into the wheel.
[tool.setuptools]
py-modules = ["sweep_and_secure"]

[tool.setuptools.dynamic]
version = { attr = "sweep_and_secure.__version__" }
